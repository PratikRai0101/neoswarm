name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Backend and TUI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: .
          NEOSWARM_DATA_DIR: ${{ runner.temp }}/neoswarm-data
        run: python -m pytest backend/tests cli/tests -q

  backend-bundle:
    name: Bundled backend smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Build standalone backend
        run: NEOSWARM_PYTHON="$(command -v python)" ./scripts/build-backend-binary.sh
      - name: Smoke test standalone backend
        env:
          NEOSWARM_DATA_DIR: ${{ runner.temp }}/neoswarm-bundle-data
        run: |
          printf '%s' '{"code":"result={\"value\":input_data[\"value\"]}","input_data":{"value":42}}' \
            | ./backend-dist/neoswarm-backend --internal python-exec \
            | grep -q '"value": 42'
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | ./backend-dist/neoswarm-backend --internal browser-agent-mcp \
            | grep -q 'neoswarm-browser-agent'
          ./backend-dist/neoswarm-backend --host 127.0.0.1 --port 18324 >backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18324/api/health/check | grep -q '"status":"ok"'; then
              exit 0
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat backend.log
              exit 1
            fi
            sleep 1
          done
          cat backend.log
          exit 1

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production and build dependencies
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build

  tauri:
    name: Tauri Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check desktop shell
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
